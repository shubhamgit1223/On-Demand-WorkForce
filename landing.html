<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workforce Platform - Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: 
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
        url('https://images.unsplash.com/photo-1577199001468-44c049e7603f?fm=jpg&q=60&w=3000');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .wrapper {
      text-align: center;
      animation: fadeIn 0.6s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      margin-bottom: 50px;
      color: white;
    }

    .header h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .header p {
      font-size: 18px;
      color: #ddd;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    .login-options {
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 900px;
      margin: 0 auto;
    }

    .login-card {
      width: 280px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .login-card h2 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .login-card p {
      color: #ddd;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }

    .btn-user {
      background: linear-gradient(135deg, #6d5dfc, #8e44ec);
    }

    .btn-user:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .btn-admin {
      background: linear-gradient(135deg, #f93b1d, #ea1e63);
    }

    .btn-admin:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 60px;
      color: #ddd;
      font-size: 13px;
    }

    .footer p {
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 36px;
      }

      .login-options {
        gap: 20px;
      }

      .login-card {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <h1>Workforce Platform</h1>
      <p>Connect • Work • Earn</p>
    </div>

    <div class="login-options">
      <!-- User/Worker Login -->
      <a href="/login" class="login-card">
        <div class="icon">👤</div>
        <h2>User Login</h2>
        <p>Login as a customer or worker to access your account and manage tasks.</p>
        <button class="btn btn-user">Login</button>
      </a>

      <!-- Admin Login -->
      <a href="/admin-login" class="login-card">
        <div class="icon">🔐</div>
        <h2>Admin Login</h2>
        <p>Access the admin panel to manage users, tasks, and platform settings.</p>
        <button class="btn btn-admin">Admin Login</button>
      </a>
    </div>

    <div class="footer">
      <p>&copy; 2026 Workforce Platform. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
