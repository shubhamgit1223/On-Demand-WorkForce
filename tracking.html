<!doctype html>
<html>
<head>
    <title>Service Tracking</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        #map {
            flex: 1;
            border-radius: 0;
        }

        .tracking-panel {
            width: 350px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-left: 2px solid #4f46e5;
            overflow-y: auto;
            padding: 20px;
        }

        .panel-header {
            color: #4f46e5;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 10px;
        }

        .booking-card {
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid #4f46e5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .info-section {
            margin-bottom: 15px;
        }

        .info-label {
            font-size: 12px;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            color: #fff;
            margin-top: 5px;
            font-weight: 600;
        }

        .location-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .location-icon {
            color: #3b82f6;
            margin-right: 8px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
        }

        .status-accepted {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .payment-section {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }

        .payment-header {
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .amount {
            font-size: 24px;
            font-weight: bold;
            color: #22c55e;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .action-btn:hover {
            background: #4338ca;
        }

        .action-btn.complete {
            background: #22c55e;
        }

        .action-btn.complete:hover {
            background: #16a34a;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #a5b4fc;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #ef4444;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            color: #86efac;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #22c55e;
        }

        /* Payment Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .payment-modal {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #4f46e5;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            color: #4f46e5;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 15px;
        }

        .payment-amount-display {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(79, 70, 229, 0.1);
            border-radius: 12px;
        }

        .payment-amount-display .label {
            color: #a5b4fc;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .payment-amount-display .amount {
            color: #22c55e;
            font-size: 32px;
            font-weight: bold;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .payment-method {
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            color: white;
            font-weight: 600;
        }

        .payment-method:hover {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.2);
        }

        .payment-method.selected {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.2);
        }

        .payment-method-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .confirm-btn {
            background: #22c55e;
            color: white;
        }

        .confirm-btn:hover {
            background: #16a34a;
        }

        .confirm-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .cancel-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Completion Modal Styles */
        .completion-modal {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #22c55e;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            animation: slideIn 0.3s ease-out;
        }

        .completion-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .completion-title {
            color: #22c55e;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .completion-message {
            color: #a5b4fc;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .completion-details {
            background: rgba(79, 70, 229, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #e6eef8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #a5b4fc;
        }

        .detail-value {
            font-weight: 600;
            color: #22c55e;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #4338ca;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .tracking-panel {
                width: 100%;
                border-left: none;
                border-top: 2px solid #4f46e5;
                height: 250px;
                max-height: 250px;
            }

            #map {
                height: calc(100vh - 250px);
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div id="map"></div>
    
    <div class="tracking-panel">
        <div class="panel-header">📍 Service Tracking</div>
        <div id="bookingContent" class="loading">Loading booking details...</div>
    </div>
</div>

<!-- Payment Modal -->
<div id="paymentModal" class="modal-overlay">
    <div class="payment-modal">
        <div class="modal-header">💳 Select Payment Method</div>
        
        <div class="payment-amount-display">
            <div class="label">Amount to Pay</div>
            <div class="amount" id="modalAmount">₹0</div>
        </div>

        <div class="payment-methods">
            <div class="payment-method" data-method="upi" onclick="selectPaymentMethod(this)">
                <div class="payment-method-icon">📱</div>
                <div>UPI</div>
            </div>
            <div class="payment-method" data-method="card" onclick="selectPaymentMethod(this)">
                <div class="payment-method-icon">💳</div>
                <div>Card</div>
            </div>
            <div class="payment-method" data-method="wallet" onclick="selectPaymentMethod(this)">
                <div class="payment-method-icon">👛</div>
                <div>Wallet</div>
            </div>
            <div class="payment-method" data-method="cash" onclick="selectPaymentMethod(this)">
                <div class="payment-method-icon">💵</div>
                <div>Cash</div>
            </div>
        </div>

        <div class="modal-actions">
            <button class="modal-btn confirm-btn" id="confirmPayBtn" disabled onclick="confirmPayment()">Pay Now</button>
            <button class="modal-btn cancel-btn" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Completion Modal -->
<div id="completionModal" class="modal-overlay">
    <div class="completion-modal">
        <div class="completion-icon">✅</div>
        <div class="completion-title">Service Completed!</div>
        <div class="completion-message">
            Thank you for using our service. Your payment has been processed successfully.
        </div>
        
        <div class="completion-details">
            <div class="detail-item">
                <span class="detail-label">Worker</span>
                <span class="detail-value" id="completionWorker">-</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Service</span>
                <span class="detail-value" id="completionService">-</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Amount Paid</span>
                <span class="detail-value" id="completionAmount">₹0</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Payment Method</span>
                <span class="detail-value" id="completionMethod">-</span>
            </div>
        </div>

        <button class="back-btn" onclick="returnToServices()">Back to Services</button>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let workerMarker;
let customerMarker;
let currentBooking = null;
let selectedPaymentMethod = null;

// Custom Icons to fix broken red icon CDN and size issues
const customerIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

const workerIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});

// Initialize map
function initMap() {
    map = L.map('map').setView([15.29, 74.69], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
}

function updateMapMarkers(booking) {
    const markers = [];

    if (booking.worker_lat && booking.worker_lng) {
        const workerLatLng = [booking.worker_lat, booking.worker_lng];
        if (workerMarker) {
            workerMarker.setLatLng(workerLatLng);
        } else {
            workerMarker = L.marker(workerLatLng, {icon: workerIcon}).addTo(map).bindPopup('Worker location');
        }
        markers.push(workerLatLng);
    }

    if (booking.customer_lat && booking.customer_lng) {
        const customerLatLng = [booking.customer_lat, booking.customer_lng];
        if (customerMarker) {
            customerMarker.setLatLng(customerLatLng);
        } else {
            customerMarker = L.marker(customerLatLng, {icon: customerIcon}).addTo(map).bindPopup('Your location');
        }
        markers.push(customerLatLng);
    }

    if (markers.length > 0) {
        const bounds = L.latLngBounds(markers);
        map.fitBounds(bounds.pad(0.2));
    }
}

// Load booking details
async function loadBookingDetails() {
    try {
        console.log('Fetching booking details...');
        const response = await fetch('/api/customer-booking', {
            method: 'GET',
            headers: {'Content-Type': 'application/json'}
        });

        const data = await response.json();
        console.log('API Response:', data);
        const content = document.getElementById('bookingContent');

        if (data.success && (data.booking_id || data.id)) {
            currentBooking = data;
            if (data.status === 'paid') {
                localStorage.setItem("worker", data.worker_name || "Worker");
                localStorage.setItem("amount", data.amount || "0");
                window.location.href = "complete.html";
                return;
            }
            displayBookingDetails(data);
        } else if (!data.success) {
            console.log('No booking found. Response:', data);
            if (data.debug_total_bookings !== undefined) {
                content.innerHTML = `<div class="error">❌ No active booking found<br>Total bookings in DB: ${data.debug_total_bookings}</div>`;
            } else {
                content.innerHTML = '<div class="error">❌ No active booking found. Please book a worker first.</div>';
            }
        } else {
            content.innerHTML = '<div class="error">❌ Invalid booking data</div>';
        }
    } catch (error) {
        console.error('Error loading booking:', error);
        document.getElementById('bookingContent').innerHTML = 
            `<div class="error">❌ Error: ${error.message}</div>`;
    }
}

// Display booking details in panel
function displayBookingDetails(booking) {
    const statusClass = booking.status === 'completed' ? 'status-completed' : 
                       booking.status === 'accepted' ? 'status-accepted' : 
                       booking.status === 'arrived' ? 'status-accepted' : 'status-pending';
    
    const statusMessage = (booking.status === 'accepted' || booking.status === 'pending')
        ? '⏳ Worker is on the way. Please click Reached when they arrive.'
        : booking.status === 'arrived'
            ? '✅ Worker has arrived! Ready for payment.'
            : booking.status === 'completed'
                ? '✅ Service completed. Thank you!'
                : '⏳ Waiting for a worker to accept your booking.';

    const html = `
        <div class="booking-card">
            <div class="info-section">
                <div class="info-label">Worker Name</div>
                <div class="info-value">${booking.worker_name || 'N/A'}</div>
            </div>

            <div class="info-section">
                <div class="info-label">Service</div>
                <div class="info-value">${booking.service || 'General Service'}</div>
            </div>

            <div class="info-section">
                <div class="info-label">Your Location</div>
                <div class="location-box">
                    <span class="location-icon">🏠</span>
                    <span>${booking.customer_location && booking.customer_location !== 'Unknown Location' ? booking.customer_location : 'Not available'}</span>
                </div>
            </div>

            <div class="info-section">
                <div class="info-label">📍 Worker Location</div>
                <div class="location-box">
                    <span class="location-icon">📌</span>
                    <span>${booking.worker_location && booking.worker_location !== 'Unknown Location' ? booking.worker_location : 'Location will appear after acceptance'}</span>
                </div>
            </div>

            <div class="info-section">
                <div class="info-label">Status</div>
                <div>
                    <span class="status-badge ${statusClass}">${booking.status}</span>
                </div>
            </div>

            <div class="info-section">
                <div class="info-value">${statusMessage}</div>
            </div>
        </div>

        <div class="payment-section">
            <div class="payment-header">💳 Payment Details</div>
            <div class="info-section">
                <div class="info-label">Amount</div>
                <div class="amount">₹${booking.amount}</div>
            </div>

            ${booking.status === 'completed' ? `
                <div class="success">✅ Service completed! Ready for payment.</div>
                <button class="action-btn complete" onclick="openPaymentModal()">💳 Pay Now</button>
            ` : booking.status === 'arrived' ? `
                <div class="success">✅ Worker has arrived! Ready for payment.</div>
                <button class="action-btn complete" onclick="openPaymentModal()">💳 Pay Now</button>
            ` : (booking.status === 'accepted' || booking.status === 'pending') ? `
                <div style="color: #a5b4fc; font-size: 14px;">
                    ⏳ Worker is active. Payment will be due after worker reaches.
                </div>
                <button class="action-btn" onclick="markWorkerArrived()" style="background: #f97316;">🎯 Reached Now</button>
            ` : `
                <div style="color: #a5b4fc; font-size: 14px;">
                    ⏳ Waiting for worker acceptance.
                </div>
            `}
        </div>

        <button class="action-btn" onclick="viewDetails()">View Details</button>
    `;

    document.getElementById('bookingContent').innerHTML = html;

    // Show both worker and customer locations on the map
    updateMapMarkers(booking);
}
async function sendCustomerLocation(latitude, longitude, address) {
    try {
        const response = await fetch('/api/update-customer-location', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                customer_lat: latitude,
                customer_lng: longitude,
                customer_location: address,
                booking_id: currentBooking ? currentBooking.booking_id : null
            })
        });
        const result = await response.json();
        if (!result.success) {
            console.warn('Failed to update customer location', result);
        }
    } catch (error) {
        console.error('Error sending customer location:', error);
    }
}

// Address cache to avoid repeated API calls
const addressCache = {};

// Reverse geocode coordinates to get address name with caching
async function getAddressFromCoordinates(lat, lng) {
    const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
    
    // Return cached result if available
    if (addressCache[key]) {
        return addressCache[key];
    }
    
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, {
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        if (!response.ok) throw new Error('Geocoding API error');
        
        const data = await response.json();
        if (data.address) {
            const address = data.address.road || data.address.neighbourhood || data.address.suburb || data.address.city || data.address.county;
            const result = address ? address : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            addressCache[key] = result;
            return result;
        }
    } catch (error) {
        console.warn('Geocoding failed, using coordinates:', error);
    }
    
    const fallback = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    addressCache[key] = fallback;
    return fallback;
}

function startCustomerLocationWatch() {
    if (!navigator.geolocation) {
        console.warn('Geolocation not supported');
        return;
    }

    navigator.geolocation.watchPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        
        // Get address asynchronously but don't block
        let address = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        
        // Try to get a better address but use coordinates as fallback
        getAddressFromCoordinates(lat, lng).then(result => {
            address = result;
        }).catch(err => {
            console.warn('Address lookup failed, using coordinates');
        });

        if (!currentBooking) {
            await loadBookingDetails();
        }

        if (currentBooking && currentBooking.status === 'accepted') {
            // Use coordinate address as fallback immediately
            sendCustomerLocation(lat, lng, address);
        }
    }, (err) => {
        console.error('Customer geolocation error:', err);
    }, {
        enableHighAccuracy: true,
        maximumAge: 10000,
        timeout: 10000
    });
}

// Process payment
function openPaymentModal() {
    if (currentBooking) {
        document.getElementById('modalAmount').textContent = `₹${currentBooking.amount}`;
        document.getElementById('paymentModal').classList.add('active');
        selectedPaymentMethod = null;
    }
}

function closePaymentModal() {
    document.getElementById('paymentModal').classList.remove('active');
    selectedPaymentMethod = null;
    resetPaymentMethods();
}

function selectPaymentMethod(element) {
    // Remove previous selection
    document.querySelectorAll('.payment-method').forEach(el => {
        el.classList.remove('selected');
    });
    
    // Add selection to clicked element
    element.classList.add('selected');
    selectedPaymentMethod = element.getAttribute('data-method');
    
    // Enable confirm button
    document.getElementById('confirmPayBtn').disabled = false;
}

function resetPaymentMethods() {
    document.querySelectorAll('.payment-method').forEach(el => {
        el.classList.remove('selected');
    });
    document.getElementById('confirmPayBtn').disabled = true;
}
function confirmPayment() {
    if (!selectedPaymentMethod || !currentBooking) {
        alert('Please select a payment method');
        return;
    }

    // Close payment modal
    closePaymentModal();

    // Get payment method display name
    const methodNames = {
        'upi': 'UPI',
        'card': 'Card',
        'wallet': 'Wallet',
        'cash': 'Cash'
    };

    // Store details in localStorage for complete.html
    localStorage.setItem("worker", currentBooking.worker_name || "Worker");
    localStorage.setItem("amount", currentBooking.amount || "0");

    // Call pay-booking API
    fetch('/api/pay-booking', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            booking_id: currentBooking.booking_id
        })
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            // Redirect to complete.html
            window.location.href = "complete.html";
        } else {
            alert('Payment Error: ' + (result.error || 'Failed to process payment'));
        }
    })
    .catch(error => {
        console.error('Error confirming payment:', error);
        alert('Error: ' + error.message);
    });
}

function returnToServices() {
    document.getElementById('completionModal').classList.remove('active');
    // Redirect to user dashboard
    window.location.href = '/dashboard';
}

// View full details
function viewDetails() {
    alert('Booking ID: ' + currentBooking.booking_id);
}

// Mark worker as arrived
async function markWorkerArrived() {
    if (!currentBooking) {
        alert('No active booking found');
        return;
    }

    try {
        const response = await fetch('/api/mark-worker-arrived', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                booking_id: currentBooking.booking_id
            })
        });

        const result = await response.json();
        
        if (result.success) {
            currentBooking.status = 'arrived';
            loadBookingDetails();
            // Automatically open payment modal
            openPaymentModal();
        } else {
            alert('Error: ' + (result.error || 'Failed to mark arrival'));
        }
    } catch (error) {
        console.error('Error marking arrival:', error);
        alert('Error: ' + error.message);
    }
}

// Initialize on page load
window.addEventListener('load', function() {
    initMap();
    loadBookingDetails();
    startCustomerLocationWatch();
    
    // Refresh booking details every 10 seconds
    setInterval(loadBookingDetails, 10000);
});
</script>
