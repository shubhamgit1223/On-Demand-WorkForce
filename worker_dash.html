<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Worker Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  display: flex;
  height: 100vh;
  background: #0f172a;
  color: white;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #1e293b;
  padding: 20px;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 30px;
}

.sidebar ul {
  list-style: none;
}

.sidebar li {
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.sidebar li:hover {
  background: #334155;
}

/* MAIN */
.main {
  flex: 1;
  padding: 20px;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.logout {
  background: #ef4444;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
}

.card h3 {
  margin-bottom: 10px;
}

/* JOB LIST */
.job-box {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.job {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #334155;
  border-radius: 8px;
  margin-top: 10px;
}

.job button {
  margin-left: 5px;
  padding: 5px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.accept { background: #22c55e; }
.reject { background: #ef4444; }

/* STATUS */
.status-btn {
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #22c55e;
  color: white;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Worker</h2>
  <ul>
    <li>Dashboard</li>
    <li onclick="goProfile()">Profile</li>
    <li onclick="goTracking()">W_Tracking</li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <h2 id="welcomeText">Welcome</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <h3>Status</h3>
      <button class="status-btn" onclick="toggleStatus()" id="statusBtn">
        Go Online
      </button>
    </div>

    <div class="card">
      <h3>Today Earnings</h3>
      <p>₹1200</p>
    </div>

    <div class="card">
      <h3>Weekly Earnings</h3>
      <p>₹6500</p>
    </div>
  </div>

  <!-- JOB REQUESTS -->
  <div class="job-box">
    <h3>Job Requests</h3>
    <div id="jobList"></div>
  </div>

</div>

<script>

// Welcome - User name is passed from Flask template
const name = "{{ user_name }}" || "Worker";
document.getElementById("welcomeText").innerText = `Welcome, ${name}`;

// Status
let online = false;
function toggleStatus() {
  online = !online;
  const btn = document.getElementById("statusBtn");

  if (online) {
    btn.innerText = "Online";
    btn.style.background = "#22c55e";
  } else {
    btn.innerText = "Offline";
    btn.style.background = "#ef4444";
  }
}

let currentJobs = [];

async function loadJobs() {
  try {
    const response = await fetch('/api/worker-bookings', {
      method: 'GET',
      headers: {'Content-Type': 'application/json'}
    });
    const data = await response.json();

    const container = document.getElementById('jobList');
    container.innerHTML = '';

    if (!data.success || !data.bookings || data.bookings.length === 0) {
      container.innerHTML = '<div class="job">No job requests available.</div>';
      return;
    }

    currentJobs = data.bookings;

    currentJobs.forEach(job => {
      const div = document.createElement('div');
      div.className = 'job';

      const actions = job.status === 'pending'
        ? `<button class="accept" onclick="acceptJob(${job.booking_id})">Accept</button>
           <button class="reject" onclick="rejectJob(${job.booking_id})">Reject</button>`
        : `<span style="display:block; margin-top: 10px; color: #a5b4fc; font-weight: 700;">${job.status.toUpperCase()}</span>`;

      div.innerHTML = `
        <div>
          <strong>${job.service}</strong><br>
          Customer: ${job.customer_name}<br>
          Address: ${job.customer_location || 'Not available'}<br>
          Price: ₹${job.amount}
        </div>

        <div>
          ${actions}
        </div>
      `;

      container.appendChild(div);
    });
  } catch (error) {
    console.error('Error loading jobs:', error);
    document.getElementById('jobList').innerHTML = '<div class="job">Failed to load job requests.</div>';
  }
}

async function acceptJob(id) {
  try {
    const response = await fetch('/api/worker-booking-action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({booking_id: id, action: 'accept'})
    });
    const result = await response.json();

    if (result.success) {
      alert('Job Accepted');
      loadJobs();
      window.location.href = 'W_tracking.html';
    } else {
      alert('Could not accept job: ' + (result.error || 'Unknown error'));
    }
  } catch (error) {
    console.error('Accept job error:', error);
    alert('Could not accept job. Please try again.');
  }
}

async function rejectJob(id) {
  try {
    const response = await fetch('/api/worker-booking-action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({booking_id: id, action: 'reject'})
    });
    const result = await response.json();

    if (result.success) {
      alert('Job Rejected');
      loadJobs();
    } else {
      alert('Could not reject job: ' + (result.error || 'Unknown error'));
    }
  } catch (error) {
    console.error('Reject job error:', error);
    alert('Could not reject job. Please try again.');
  }
}

loadJobs();
setInterval(loadJobs, 5000);

// Navigation
function goProfile() {
  window.location.href = "profile.html";
}

function goTracking() {
  window.location.href = "W_tracking.html";
}

// Logout
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

</script>

</body>
</html>
