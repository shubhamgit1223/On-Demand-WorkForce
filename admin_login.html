<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Workforce Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      background: 
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1577199001468-44c049e7603f?fm=jpg&q=60&w=3000');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 350px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

      color: #fff;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h2 {
      color: #fff;
      font-size: 28px;
    }

    .header p {
      color: #ddd;
      font-size: 14px;
      margin-top: 5px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #ddd;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .input-group input:focus {
      border-color: #f93b1d;
      box-shadow: 0 0 8px rgba(249, 59, 29, 0.5);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #f93b1d, #ea1e63);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      margin-top: 20px;
      color: #ccc;
    }

    .footer a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .footer a:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>🔐 Admin Login</h2>
      <p>Workforce Platform Administration</p>
    </div>

    <form action="/admin-login" method="POST">

      <div class="input-group">
        <label>Admin Username</label>
        <input type="text" name="Username" placeholder="Enter admin username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="Password" placeholder="Enter password" required>
      </div>

      <button class="btn">Login as Admin</button>

    </form>

    <div class="footer">
      <a href="/">← Back to Home</a>
    </div>

  </div>

  {% if error %}
  <script>alert("{{ error }}");</script>
  {% endif %}
  {% if success %}
  <script>alert("{{ success }}");</script>
  {% endif %}

</body>
</html>
