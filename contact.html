<!doctype html>
<html>
<head>
    <title>Contact Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            font-size: 16px;
            color: #555;
            margin: 15px 0;
        }

        a {
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .contact-item {
            background: #f9fafc;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Contact Us</h1>

        <p class="contact-item">
            Email: 
            <a href="mailto:workforce@gmail.com">workforce@gmail.com</a>
        </p>

        <p class="contact-item">
            Phone: 
            <a href="tel:+919141175718">+91 9141175718</a>
        </p>

        <p class="contact-item">
            Address: Bustand Road, Haliyal, Karnataka - 581329
        </p>
    </div>
</body>
</html>
